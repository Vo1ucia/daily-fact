name: Anecdote du jour

on:
  schedule:
    # 7h00 UTC = 9h en heure d'été, 8h en heure d'hiver (Paris).
    # Le cron GitHub ne gère pas les fuseaux horaires.
    - cron: '17 7 * * *'
  workflow_dispatch: # permet de déclencher à la main depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour réécrire deja-vues.json

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Récupérer et publier l'anecdote
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node anecdote.js

      - name: Mémoriser l'anecdote publiée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deja-vues.json
          git diff --staged --quiet || git commit -m "Anecdote du $(date +%F)"
          git push
